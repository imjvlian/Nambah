<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Legends Starlight Membership</title>
  <desc id="desc">Dedicated Starlight pass artwork for Nambah product cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142748"/>
      <stop offset="0.52" stop-color="#253867"/>
      <stop offset="1" stop-color="#10172d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.45" stop-color="#f0ca6d"/>
      <stop offset="1" stop-color="#a66d28"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#c6d7ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="250" r="190" fill="url(#bg)" opacity=".98"/>
  <circle cx="256" cy="250" r="175" fill="none" stroke="#8eafff" stroke-opacity=".24" stroke-width="2"/>
  <path d="M256 68l22 72 70-29-39 65 70 25-75 8 13 75-61-45-61 45 13-75-75-8 70-25-39-65 70 29z" fill="#7da9ff" opacity=".11" filter="url(#glow)"/>

  <g transform="translate(96 118)">
    <path d="M38 46c0-16 13-29 29-29h186c16 0 29 13 29 29v232c0 16-13 29-29 29H67c-16 0-29-13-29-29V46z" fill="#17233e" stroke="url(#gold)" stroke-width="7"/>
    <path d="M62 65h196v187c-26 20-57 33-98 39-41-6-72-19-98-39V65z" fill="url(#bg)" stroke="#7da9ff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M160 87l18 43 47 4-36 30 11 46-40-24-40 24 11-46-36-30 47-4z" fill="url(#gold)" filter="url(#glow)"/>
    <path d="M160 101l10 25 28 2-21 18 6 27-23-14-23 14 6-27-21-18 28-2z" fill="#f7e29b"/>
    <path d="M93 224h134" stroke="url(#blue)" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    <text x="160" y="249" text-anchor="middle" fill="#f8e7aa" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="4">STARLIGHT</text>
    <text x="160" y="277" text-anchor="middle" fill="#b7c9f8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">MEMBERSHIP</text>
  </g>

  <g fill="#d9e4ff" opacity=".72">
    <circle cx="94" cy="156" r="4"/><circle cx="415" cy="181" r="5"/><circle cx="391" cy="350" r="3"/><circle cx="126" cy="379" r="3"/>
  </g>
</svg>
