name: Sync Codashop product assets

on:
  push:
    branches:
      - roadmap-0.3.25
    paths:
      - scripts/sync-codashop-product-assets.mjs
      - .github/workflows/sync-codashop-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    if: ${{ !contains(github.event.head_commit.message || '', '[assets-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync public product assets
        env:
          CODASHOP_ASSET_MAX_PRODUCTS: 500
        run: node scripts/sync-codashop-product-assets.mjs

      - name: Commit synced assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-assets/codashop
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "0.3.25 [assets-sync]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
